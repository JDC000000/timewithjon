allowBuilds:
  esbuild: true
  unrs-resolver: true

# Transitive dependencies held at a fixed floor (postcss, css-tree and vite still allow older versions).
# vite >= 8.3.3 and undici >= 8.12.2: patch floors (undici is a test-tool dependency via jsdom).
overrides:
  source-map-js: ^1.2.2
  vite: ^8.3.3
  undici: ^8.12.2
